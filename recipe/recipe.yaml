schema_version: 1

context:
  name: azure-kusto-data
  version: "6.0.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 225321b9d3e9c56f0b46bda6182ffd6cf0e38d721d8ef6638d9a4b2b28fee4e5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.8.9,<0.9.0
  run:
    - python >=${{ python_min }}
    - python-dateutil >=2.9.0
    - requests >=2.32.4
    - azure-identity >=1.25.3,<2
    - msal >=1.35.1,<2
    - ijson >=3.4.0,<3.7.0
    - azure-core >=1.35.0,<2
tests:
  - python:
      imports:
        - azure.kusto
        - azure.kusto.data
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Kusto Data Client
  description: |
    Kusto Python Client Library provides the capability to query Kusto clusters
    using Python. It is Python 3.x compatible and supports all data types
    through familiar Python DB API interface.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-kusto-python
  repository: https://github.com/Azure/azure-kusto-python
  documentation: https://github.com/Azure/azure-kusto-python

extra:
  recipe-maintainers:
    - xylar
